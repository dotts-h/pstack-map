<title>pstack map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23F2C46B'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#080B12; --surface:#10141C; --surface-2:#161B26; --surface-3:#1C2230; --border:#232A38; --border-strong:#343D50;
  --text:#E6EAF2; --text-2:#AEB7C9; --text-3:#8D96A8; --focus:#8EC1F0;
  --k-router:#F2C46B; --k-playbook:#6FA8DC; --k-skill:#D08BBE; --k-principle:#55C2A2;
  --k-agent:#E0956A; --k-automation:#A394E6; --k-script:#A8B3C2; --k-reference:#C2AE86; --k-other:#7D8594;
  --e-loads:#F2C46B; --e-applies:#55C2A2; --e-runs:#A8B3C2; --e-imports:#A8B3C2; --e-references:#6B7690; --e-references-hl:#AEB7C9; --e-other:#5A6378;
  --guide:#2A3550; --guide-outer:#41507A; --dim:#262D3B;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --header-h:56px;
  --glass:rgba(16,20,28,.94);
  --shadow-1:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-2:0 2px 4px rgba(0,0,0,.45),0 16px 40px rgba(0,0,0,.5);
  --label-bg:rgba(8,11,18,.74);
  --header-bg:rgba(10,13,20,.86);
  --ease:cubic-bezier(.2,.7,.2,1);
}
html[data-theme=kitchen]{
  --bg:#0D0A08; --surface:#17120E; --surface-2:#211A14; --surface-3:#2B221A; --border:#33281E; --border-strong:#4A3B2C;
  --text:#F1E9DC; --text-2:#C9BBA6; --text-3:#A3937D; --focus:#E8C27A; --brass:#C9A15F;
  --k-router:#E2BB72; --k-playbook:#CFD5DD; --k-skill:#C98258; --k-principle:#8FB27C;
  --k-agent:#D9A06E; --k-automation:#8C9DB8; --k-script:#C0705F; --k-reference:#C9A86E; --k-other:#8A7F72;
  --e-loads:#E2BB72; --e-applies:#8FB27C; --e-runs:#C98258; --e-imports:#C98258; --e-references:#7A6A58; --e-references-hl:#CDBFAA; --e-other:#5E5245;
  --guide:#3A2E20; --guide-outer:#6B5533; --dim:#2A231C;
  --glass:rgba(23,18,14,.94); --label-bg:rgba(13,10,8,.76); --header-bg:rgba(13,10,8,.88);
}
html[data-theme=circuit]{
  --bg:#050807; --surface:#0C1210; --surface-2:#121A17; --surface-3:#18221E; --border:#1F2C27; --border-strong:#2E3F38;
  --text:#E6ECE8; --text-2:#B2BEB8; --text-3:#8F9C96; --focus:#9ED9BE;
  --k-router:#E2C27A; --k-playbook:#8FB4D9; --k-skill:#D9A27A; --k-principle:#6FCFA8;
  --k-agent:#C9CED6; --k-automation:#A397E6; --k-script:#9AA6B2; --k-reference:#D8B45C; --k-other:#7D8594;
  --e-loads:#E2C27A; --e-applies:#6FCFA8; --e-runs:#A397E6; --e-imports:#A397E6; --e-references:#B5733F; --e-references-hl:#E8A872; --e-other:#5C4A3A;
  --guide:#1E3A2F; --guide-outer:#C9D3CC; --dim:#18211D;
  --glass:rgba(12,18,16,.94); --label-bg:rgba(5,8,7,.76); --header-bg:rgba(5,8,7,.86);
}
html[data-theme=earth]{
  --bg:#04070C; --surface:#0C121B; --surface-2:#121A25; --surface-3:#18222F; --border:#1F2A38; --border-strong:#2E3B4D;
  --text:#E8ECF2; --text-2:#B0BAC8; --text-3:#8E99A9; --focus:#8EC1F0;
  --k-router:#F2C46B; --k-playbook:#F3DDB0; --k-skill:#E9A46A; --k-principle:#7FD1B2;
  --k-agent:#E8907C; --k-automation:#B7A4EA; --k-script:#97A3B4; --k-reference:#9DB6D2; --k-other:#7D8594;
  --e-loads:#F2C46B; --e-applies:#7FD1B2; --e-runs:#B7A4EA; --e-imports:#B7A4EA; --e-references:#5E7590; --e-references-hl:#B9C9DC; --e-other:#4F5D70;
  --guide:#1A2A3C; --guide-outer:#2B4058; --dim:#1D2632;
  --glass:rgba(12,18,27,.94); --label-bg:rgba(4,7,12,.74); --header-bg:rgba(4,7,12,.86);
}
html[data-theme=galaxy]{
  --bg:#03040A; --surface:#0B0D16; --surface-2:#11141F; --surface-3:#171B28; --border:#1E2332; --border-strong:#2D3346;
  --text:#ECEEF4; --text-2:#B3B9C8; --text-3:#8F96A8; --focus:#9CC3F2;
  --k-router:#FFC98A; --k-playbook:#FFF1D6; --k-skill:#E9B48C; --k-principle:#E8D2A8;
  --k-agent:#A9CBEA; --k-automation:#C7BBA6; --k-script:#B9BCC4; --k-reference:#C9CCD3; --k-other:#9AA0AA;
  --e-loads:#FFD9A0; --e-applies:#9FD8C4; --e-runs:#C3B5F0; --e-imports:#C3B5F0; --e-references:#6C7894; --e-references-hl:#BCC6DA; --e-other:#56607A;
  --guide:#1A2134; --guide-outer:#2A3550; --dim:#1B2030;
  --glass:rgba(9,11,19,.92); --label-bg:rgba(3,4,10,.72); --header-bg:rgba(3,4,10,.82);
}
html[data-theme=brain]{
  --bg:#06070C; --surface:#0E1018; --surface-2:#141722; --surface-3:#1A1E2B; --border:#222738; --border-strong:#323950;
  --text:#E8EAF2; --text-2:#B3B8CA; --text-3:#9097AB; --focus:#A9B8F2;
  --k-router:#F2C46B; --k-playbook:#7FB2F0; --k-skill:#E39AC6; --k-principle:#5FCBA8;
  --k-agent:#F0A07A; --k-automation:#A99AF0; --k-script:#A8B3C2; --k-reference:#D2BC8E; --k-other:#7D8594;
  --e-loads:#F2C46B; --e-applies:#5FCBA8; --e-runs:#A99AF0; --e-imports:#A99AF0; --e-references:#5F6884; --e-references-hl:#B8BED4; --e-other:#4E566C;
  --guide:#232A40; --guide-outer:#3A4466; --dim:#20242F;
  --glass:rgba(14,16,24,.94); --label-bg:rgba(6,7,12,.74); --header-bg:rgba(6,7,12,.86);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/20px var(--font-sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#scene{position:fixed;inset:var(--header-h) 0 0 0;z-index:0;touch-action:none}
#scene::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
#labels{position:fixed;inset:var(--header-h) 0 0 0;z-index:1;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:30;display:grid;grid-template-columns:1fr minmax(240px,400px) 1fr;align-items:center;gap:16px;padding:0 16px;background:var(--header-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand em{font-style:normal}
html[data-theme=kitchen] .brand em{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:17px;color:var(--brass);letter-spacing:.01em}
html[data-theme=circuit] .brand em{font-family:var(--font-mono);font-size:14px;color:#D8B45C;letter-spacing:.04em}
html[data-theme=earth] .brand em{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:17px;color:#9DB6D2}
html[data-theme=brain] .brand em{font-weight:300;font-size:16px;color:#A9B8F2;letter-spacing:.02em}
html[data-theme=galaxy] .brand em{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:17px;color:#FFE2B8}
.theme-pick{height:32px;border-radius:16px;border:1px solid var(--border);background-color:var(--surface);color:var(--text);font:13px/20px var(--font-sans);padding:0 26px 0 12px;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
html:not([data-theme=sphere]) .key{width:292px}
.ksub{display:block;color:var(--text-3);font-size:12px;line-height:16px;font-weight:400;margin-top:2px}
.krow.tall{height:auto;min-height:28px;padding-top:6px;padding-bottom:6px;align-items:flex-start}
.krow.tall .name{text-decoration:none!important}
.krow.tall svg{margin-top:2px}
.rank{display:inline-flex;gap:2px;margin-right:5px;vertical-align:-1px}
.rank i{display:block;width:3px;height:10px;border-radius:1px;background:var(--brass,#C9A15F)}
.lbl.router .rank i{background:#1A1208}
.rank.ring i{background:none;border:1px solid var(--brass,#C9A15F);width:6px;height:6px;border-radius:50%;margin-top:2px}
html[data-theme=earth] .lbl.router::before{content:'★ '}
html:not([data-theme=sphere]) #seg{display:none}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--k-router);box-shadow:0 0 0 4px rgba(242,196,107,.16),0 0 12px rgba(242,196,107,.5)}
.search{position:relative}
.search input{width:100%;height:36px;border:1px solid var(--border);border-radius:18px;background:var(--surface);font:14px var(--font-sans);color:var(--text);padding:0 40px 0 36px;outline:none}
.search input:focus{border-color:var(--focus)}
.search input::placeholder{color:var(--text-3)}
.search>svg{position:absolute;left:12px;top:10px;pointer-events:none}
.kbd{font:12px/18px var(--font-mono);color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 6px;background:var(--surface-2)}
.search .kbd{position:absolute;right:10px;top:8px}
.results{position:absolute;top:44px;left:0;right:0;z-index:40;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-2);padding:4px;display:none;list-style:none;margin:0}
.results.open{display:block}
.results li{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:8px;cursor:pointer}
.results li[aria-selected=true],.results li:hover{background:var(--surface-2)}
.results li .k{margin-left:auto;font-size:12px;color:var(--text-3)}
.results .empty{height:auto;padding:12px;color:var(--text-2);cursor:default;display:block}
.results .empty:hover{background:none}
.results mark{background:none;color:var(--text);font-weight:600}
.hright{display:flex;justify-content:flex-end;align-items:center;gap:16px;font-size:13px;color:var(--text-2)}
.hright a{text-decoration:none}.hright a:hover{text-decoration:underline}
.ghost-btn{all:unset;cursor:pointer;height:32px;padding:0 12px;border-radius:16px;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.ghost-btn:hover{background:var(--surface-2);color:var(--text)}
.ghost-btn:focus-visible{outline:2px solid var(--focus)}
#searchBtn{display:none}
.about{position:fixed;top:calc(var(--header-h) + 8px);right:16px;width:300px;z-index:40;background:var(--glass);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-2);padding:16px;display:none}
.about.open{display:block}
.about p{margin:0 0 12px;color:var(--text-2)}
.about dl{display:grid;grid-template-columns:88px 1fr;row-gap:4px;margin:0;font-size:13px}
.about dt{color:var(--text-3)}.about dd{margin:0}
.key{position:fixed;left:16px;bottom:16px;width:216px;z-index:10;background:var(--glass);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-1);padding:8px 0}
.key h3{margin:0;padding:4px 16px 8px;font-size:12px;line-height:16px;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between}
.key h3 span{font-weight:400;color:var(--text-3)}
.krow{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;height:28px;padding:0 16px;cursor:pointer}
.krow:hover{background:var(--surface-2)}
.krow:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.krow .name{flex:1}.krow .count{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.krow[aria-pressed=false]{opacity:.45}
.krow[aria-pressed=false] .name{text-decoration:line-through}
.krow:disabled{cursor:default}
.kdiv{height:1px;background:var(--border);margin:8px 0}
.kmore{all:unset;cursor:pointer;display:flex;justify-content:space-between;width:100%;box-sizing:border-box;padding:4px 16px;font-size:12px;color:var(--text-2)}
.kmore:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.kedges{display:none}.kedges.open{display:block}
body.focus .key{display:none}
.controls{position:fixed;right:16px;bottom:16px;z-index:10;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--border);border-radius:18px;padding:3px;box-shadow:var(--shadow-1)}
.seg span{font-size:12px;color:var(--text-3);padding:0 8px 0 10px;align-self:center}
.seg a{height:28px;padding:0 12px;border-radius:14px;display:inline-flex;align-items:center;text-decoration:none;color:var(--text-2);font-size:13px}
.seg a[aria-current]{background:var(--surface-3);color:var(--text)}
.btn{height:36px;padding:0 14px;border:1px solid var(--border);border-radius:18px;background:var(--glass);box-shadow:var(--shadow-1);font:500 13px var(--font-sans);color:var(--text);display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2);border-color:var(--border-strong)}
#keyBtn{display:none}
.debug{font:11px var(--font-mono);color:var(--text-3);margin-right:8px}
.hint{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);z-index:12;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:24px;background:var(--glass);border:1px solid var(--border-strong);box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease);white-space:nowrap}
.hint.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.hint b{font-weight:600}.hint small{color:var(--text-3);font-size:13px}
.hint .dot{width:10px;height:10px;border-radius:50%;background:var(--k-playbook);box-shadow:0 0 10px rgba(111,168,220,.7)}
.hint button{all:unset;cursor:pointer;height:32px;padding:0 14px;border-radius:16px;background:var(--surface-3);font-weight:500;font-size:13px}
.hint button:hover{background:var(--border-strong)}.hint button:focus-visible{outline:2px solid var(--focus)}
.trail{position:fixed;top:calc(var(--header-h) + 16px);left:50%;transform:translateX(-50%);z-index:15;display:none;align-items:center;gap:4px;height:40px;padding:0 4px;border-radius:20px;background:var(--glass);border:1px solid var(--border);box-shadow:var(--shadow-1);white-space:nowrap;max-width:calc(100vw - 32px)}
body.focus .trail{display:flex}
.trail .back{all:unset;cursor:pointer;height:32px;padding:0 12px 0 8px;border-radius:16px;display:inline-flex;align-items:center;gap:4px;font-weight:500;font-size:13px}
.trail .back:hover,.trail .exit:hover,.trail ol button:hover{background:var(--surface-2)}
.trail .back:focus-visible,.trail .exit:focus-visible,.trail ol button:focus-visible{outline:2px solid var(--focus)}
.trail .vsep{width:1px;height:20px;background:var(--border);margin:0 4px}
.trail ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:2px;font-size:13px;overflow:hidden}
.trail li{display:flex;align-items:center;gap:2px;min-width:0}
.trail li+li::before{content:'›';color:var(--text-3);padding:0 4px}
.trail ol button{all:unset;cursor:pointer;color:var(--text-2);padding:0 8px;height:28px;border-radius:14px;display:inline-flex;align-items:center;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.trail li[aria-current] span{color:var(--text);font-weight:600;padding:0 8px;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.trail .exit{all:unset;cursor:pointer;width:32px;height:32px;border-radius:16px;display:inline-grid;place-items:center;color:var(--text-2)}
.pop{position:fixed;z-index:20;width:320px;max-height:420px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-2);opacity:0;transform:translateY(8px);transition:opacity .18s var(--ease),transform .18s var(--ease);pointer-events:none}
.pop.show{opacity:1;transform:none;pointer-events:auto}
.pop.expanded{max-height:min(640px,calc(100vh - 160px))}
.pop .caret{position:absolute;left:var(--cx,50%);width:12px;height:12px;background:var(--surface);border:1px solid var(--border-strong);transform:translateX(-50%) rotate(45deg)}
.pop.below .caret{top:-7px;border-right:0;border-bottom:0}
.pop.above .caret{bottom:-7px;border-left:0;border-top:0}
.pop.side .caret{display:none}
.pop-scroll{overflow:auto;min-height:0;padding:0 16px 16px;border-radius:12px}
.pop-head{position:sticky;top:0;z-index:1;background:var(--surface);padding:16px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;border-radius:12px 12px 0 0}
.pop.expanded .pop-head{box-shadow:0 1px 0 var(--border)}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--text-2);font-weight:500}
.pop .x{all:unset;cursor:pointer;position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--text-3)}
.pop .x:hover{background:var(--surface-2);color:var(--text)}.pop .x:focus-visible{outline:2px solid var(--focus)}
.pop h2{margin:4px 32px 4px 0;font-size:20px;line-height:24px;font-weight:650;letter-spacing:-.015em}
.pop .what{margin:0 0 4px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pop .try{font-size:12px;color:var(--text-3);margin-top:4px}
.pop .try code{font:12px var(--font-mono);color:var(--text-2);background:var(--surface-2);border-radius:4px;padding:1px 6px}
.grp{margin-top:16px}
.grp h3{margin:0 0 8px;font-size:12px;line-height:16px;font-weight:600;color:var(--text-2)}
.grp h3 span{color:var(--text-3);font-weight:400;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;height:28px;max-width:100%;padding:0 10px 0 8px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.chip:hover{background:var(--surface-3);border-color:var(--border-strong)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.chip.more{color:var(--text-2);background:none;border-style:dashed;border-color:var(--border-strong);padding:0 10px}
.pop-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.link{all:unset;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px;border-radius:6px}
.link:hover{color:var(--text)}.link:focus-visible{outline:2px solid var(--focus)}
.link svg{transition:transform .18s}
.link[aria-expanded=true] svg{transform:rotate(180deg)}
.details{display:none;margin-top:12px}
.pop.expanded .details{display:block}
.details dl{display:grid;grid-template-columns:72px 1fr;row-gap:4px;margin:0 0 12px;font-size:12px}
.details dt{color:var(--text-3)}.details dd{margin:0;font-family:var(--font-mono);color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.details h4{margin:12px 0 4px;font-size:12px;font-weight:600;color:var(--text-2)}
.conn{display:grid;grid-template-columns:auto 1fr;column-gap:8px;font-size:12px;line-height:16px;padding:4px 0;border-top:1px solid var(--border)}
.conn .t{color:var(--text-3);font-family:var(--font-mono)}.conn .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    <button class="ghost-btn" id="aboutBtn" type="button" aria-expanded="false" aria-controls="about"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.2v3.8" stroke-linecap="round"/><circle cx="8" cy="5" r=".6" fill="currentColor"/></svg><span class="about-txt">About</span></button>
